name: Export standalone living-room Creator shot
on:
  push:
    branches:
      - content/drive-source-fill-20261116
    paths:
      - .github/workflows/export-creator-intro.yml
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/drive-source-fill-20261116
      - name: Export the independent living-room shot from the approved public opening source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -i site/assets/video/product-opening.mp4 \
            -t 2.8 -vf "scale=480:-2:flags=lanczos,fps=24,format=yuv420p" \
            -c:v libx264 -preset medium -crf 23 -an -movflags +faststart \
            site/assets/video/creator-livingroom-intro.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height -of json site/assets/video/creator-livingroom-intro.mp4
          node scripts/update-manifest.cjs
      - name: Commit standalone Creator scene on isolated source branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/video/creator-livingroom-intro.mp4 PUBLIC_ASSETS.json
          git commit -m "Export standalone living-room Creator clip for distinct portfolio scenes"
          git push origin HEAD:refs/heads/content/drive-source-fill-20261116
