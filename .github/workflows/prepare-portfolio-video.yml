name: Add portfolio video excerpts to the review branch

on:
  push:
    branches:
      - portfolio/strategy-video-20261120
    paths:
      - '.github/workflows/prepare-portfolio-video.yml'

permissions:
  contents: write

jobs:
  stage-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and stage the two review excerpts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets/video
          for name in holiday-story stair-demo
          do
            cat .portfolio-video-transfer/"$name"-*.b64 | base64 --decode > "site/assets/video/$name.mp4"
          done
          sha256sum -c <<'CHECKSUM'
          0dea98b46be3d4f0ea6d53c9a9bea573aa5278d4ad6c310daed494a9ce10467f  site/assets/video/holiday-story.mp4
          783bb6cc016574f5df11d6f07a8b92be7bbe86cb0ac573054af874c6028d2d64  site/assets/video/stair-demo.mp4
          CHECKSUM
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/assets/video/holiday-story.mp4 site/assets/video/stair-demo.mp4
          git rm -r -- .portfolio-video-transfer
          git commit -m "Add anonymized portfolio video excerpts"
          git push origin HEAD:refs/heads/portfolio/strategy-video-20261120
