name: Validate and deploy portfolio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, refactor/visual-case-portfolio-20261102]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify FFmpeg validation tools
        run: |
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          ffprobe -version | head -n 1
      - name: Validate public site and privacy boundary
        run: |
          npm ci
          npm test
      - name: Validate desktop and mobile layout in real Chrome
        if: github.event_name == 'pull_request'
        timeout-minutes: 4
        run: |
          command -v google-chrome || command -v chromium
          node scripts/site-visual-audit.cjs > /tmp/portfolio-pr-visual.log 2>&1 || { tail -n 65 /tmp/portfolio-pr-visual.log; exit 1; }
          grep 'VISUAL_QA_RESULT=' /tmp/portfolio-pr-visual.log | tail -n 1
      - name: Archive responsive visual QA metrics
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-responsive-qa
          path: qa/live-visual-audit.json
          if-no-files-found: warn
      - name: Upload isolated pull-request preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview-${{ github.sha }}
          path: |
            site/
            preview.cjs
          retention-days: 3
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
