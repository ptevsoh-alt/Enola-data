name: Stage the verified portfolio audit media
on:
  push:
    branches:
      - portfolio/full-content-audit-20261120
    paths:
      - '.github/workflows/prepare-portfolio-audit-assets.yml'
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and write four audited media files
        shell: bash
        run: |
          set -euo pipefail
          cat .portfolio-audit-transfer/product-opening-*.b64 | base64 --decode > "site/assets/video/product-opening.mp4"
          cat .portfolio-audit-transfer/exhibition-booth-angle-redacted-*.b64 | base64 --decode > "site/assets/projects/exhibition-booth-angle-redacted.jpg"
          cat .portfolio-audit-transfer/exhibition-booth-overview-redacted-*.b64 | base64 --decode > "site/assets/projects/exhibition-booth-overview-redacted.jpg"
          cat .portfolio-audit-transfer/exhibition-product-display-redacted-*.b64 | base64 --decode > "site/assets/projects/exhibition-product-display-redacted.jpg"
          sha256sum -c <<'CHECKSUM'
          3b9a811a05b17439b5ad717d77ca5b2aa2671f8e12bd80f59fc409fbbcc614d9  site/assets/video/product-opening.mp4
          8b87fc83a69f0f65e1bc4b20fcd9ea32ee7827b0a4d2327722bf74bad27677c9  site/assets/projects/exhibition-booth-angle-redacted.jpg
          0ab3abf73bf2a9efc75f5ba09ef82ee1142229a8247b0ef98295a2024ec955f2  site/assets/projects/exhibition-booth-overview-redacted.jpg
          e65f4cf1a2b1c053763c778b17f1aead42aa7448bedfdbc6c9ffd94fed4936a9  site/assets/projects/exhibition-product-display-redacted.jpg
          CHECKSUM
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "site/assets/video/product-opening.mp4" "site/assets/projects/exhibition-booth-angle-redacted.jpg" "site/assets/projects/exhibition-booth-overview-redacted.jpg" "site/assets/projects/exhibition-product-display-redacted.jpg"
          git rm -r -- .portfolio-audit-transfer
          git commit -m "Stage audited video and exhibition photographs"
          git push origin HEAD:refs/heads/portfolio/full-content-audit-20261120
